[Timer]
# Moved :10/:40 -> :26/:56 on 2026-11-03. Both old minutes sat inside the two
# fullest windows on the box and ember was refused a slot on 46 of 50 fires.
#
# The old comment here dodged "the competitor (:06,:26,:46 for up to 260s)".
# That premise expired: abagent is now hourly at :06 and its MEASURED median
# hold is 839s, not 260 -- so :06 blocks through :20, not through :10. A
# stagger computed against assumed hold times decays silently as the jobs
# change. These minutes come from 25h of measured slot occupancy instead
# (mean slots busy, 2.00 = no room):
#
#   :06-:10  1.88-1.94  FULL   <- old ember :10 sat here (abagent + explore)
#   :35-:42  1.93-2.00  FULL   <- old ember :40 sat here (pike + explore)
#   :26      0.54       free
#   :56      0.10       free   (emptiest minute of the hour)
#
# ember holds a slot for 71s median, 91s max, so it clears well before health
# at :27/:57 -- which is unserialised anyway and took 0 slots in 25h.
OnCalendar=
OnCalendar=*:26/30
