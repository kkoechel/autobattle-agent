android.useAndroidX=true

# BUILT ON A 7.5GB LAPTOP that is also running VS Code and a browser.
#
# Uncapped, this build sat on ~3.3GB between invocations -- a 2.1GB Gradle
# daemon plus a 1.2GB Kotlin daemon, held for hours after the build finished
# -- which filled a 2GB swapfile and made the whole machine crawl. The fix is
# to bound the build, not to add swap: the work genuinely fits, it was simply
# never asked to.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# The Kotlin daemon is a SEPARATE JVM and does not inherit the line above.
# Left alone it grew to 1.2GB beside the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx1024m

# Four cores, shared with an IDE and a browser. Letting Gradle take all of
# them makes the machine unusable while it builds and does not finish sooner.
org.gradle.workers.max=2

# Stop holding memory once the build is done. The default keeps the daemon
# resident for three hours.
org.gradle.daemon.idletimeout=900000
