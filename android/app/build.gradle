apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing, mirroring autobattle-mobile. keystore.properties and the
// .jks itself stay OUT of git; the build falls back to unsigned when they are
// absent so a clean checkout still builds a debug APK.
//
// Deliberately reuses autobattle-mobile's keystore rather than minting a new
// one: under Play App Signing this is only the UPLOAD key (Google holds the
// real signing key), so it is one secret to protect instead of two, it is
// already backed up, and it has already been through Android developer
// verification once.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'online.autobattle.agent'
    compileSdk 36

    defaultConfig {
        applicationId "online.autobattle.agent"
        minSdk 24
        targetSdk 36
        // 41, not 40: the 10-29 bundle is already 1.30-40 and carries engine
        // v4.52. Rebuilding at the same versionCode would leave two different
        // binaries sharing one identity, which is the bug that gets uploaded
        // by mistake six weeks later. Play also rejects a duplicate code.
        //
        // 42 on 2026-11-06, onto engine v4.59 (a99ddd3). versionCode 41
        // SHIPPED: the 11-03 bundle went to Play carrying engine v4.56. The
        // three notes that used to sit here argued the opposite -- that 41
        // could be reused because it "never left the laptop" -- and that was
        // true when written and false by the time it mattered. A comment
        // asserting a binary is unreleased ages into a comment asserting the
        // wrong thing, and the next build reasons from it. So: assume a built
        // code is spent unless the Play console says otherwise.
        //
        // versionName moves with it, as it has for every shipped code (39->40
        // came with 1.29->1.30, 38->39 with 1.28->1.29). 1.30 is public now,
        // so this is 1.31.
        //
        // This bump is not cosmetic. Engines 4.56 through 4.58 carry a Go
        // panic on discard, fixed in 4.59: a hand card arrived in the discard
        // pile before leaving the hand, so an on_discard trigger that discards
        // again indexed past the end. engine.go has no recover() and Kotlin
        // calls Mobile.run() unwrapped, so that panic aborts the process
        // instead of raising an exception. Players on 41 can crash.
        //
        // Check tools/check_engine_parity.sh immediately before uploading, not
        // when starting the build, because the answer changes daily.
        versionCode 42
        versionName "1.31"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Side-by-side test install: ./gradlew assembleRelease -PdevId
        //
        // A build signed with the UPLOAD key cannot replace one Play
        // installed, because Play re-signs with its own -- so verifying a
        // change on a real phone otherwise means uninstalling the player's
        // app. That takes their token with it, and since their handle is
        // already registered they cannot rejoin as themselves. A separate
        // applicationId installs beside it and touches nothing.
        manifestPlaceholders = [appLabel: "Cardbattle"]
        if (project.hasProperty('devId')) {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            // Renamed too, or the two sit side by side on the launcher under
            // the same name and the wrong one gets opened.
            manifestPlaceholders = [appLabel: "Cardbattle (dev)"]
        }

        // The engine AAR ships arm64 only. Adding more ABIs means rebuilding
        // it with more -target values in build_aar.sh; each one adds ~3.8MB of
        // libgojni.so to the APK.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
        }
    }

    buildFeatures { compose true }
}

dependencies {
    implementation files('libs/engine.aar')

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
