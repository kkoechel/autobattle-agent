apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing, mirroring autobattle-mobile. keystore.properties and the
// .jks itself stay OUT of git; the build falls back to unsigned when they are
// absent so a clean checkout still builds a debug APK.
//
// Deliberately reuses autobattle-mobile's keystore rather than minting a new
// one: under Play App Signing this is only the UPLOAD key (Google holds the
// real signing key), so it is one secret to protect instead of two, it is
// already backed up, and it has already been through Android developer
// verification once.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'online.autobattle.agent'
    compileSdk 36

    defaultConfig {
        applicationId "online.autobattle.agent"
        minSdk 24
        targetSdk 36
        // 41, not 40: the 10-29 bundle is already 1.30-40 and carries engine
        // v4.52. Rebuilding at the same versionCode would leave two different
        // binaries sharing one identity, which is the bug that gets uploaded
        // by mistake six weeks later. Play also rejects a duplicate code.
        //
        // 42 on 2026-11-06, onto engine v4.59 (a99ddd3). versionCode 41
        // SHIPPED: the 11-03 bundle went to Play carrying engine v4.56.
        //
        // UNVERIFIED as of 2026-11-11, and flagged rather than repeated as
        // fact. The S22 cannot confirm it: the app installed there under the
        // production id is a DEBUG-signed sideload at versionCode 40 with
        // installerPackageName=null, so it is not a Play delivery and says
        // nothing about what Play holds. Only the Play Console can settle it;
        // Ryan is checking. Nothing below depends on the answer -- "assume a
        // built code is spent" is the conservative reading either way. The
        // three notes that used to sit here argued the opposite -- that 41
        // could be reused because it "never left the laptop" -- and that was
        // true when written and false by the time it mattered. A comment
        // asserting a binary is unreleased ages into a comment asserting the
        // wrong thing, and the next build reasons from it. So: assume a built
        // code is spent unless the Play console says otherwise.
        //
        // versionName moves with it, as it has for every shipped code (39->40
        // came with 1.29->1.30, 38->39 with 1.28->1.29). 1.30 is public now,
        // so this is 1.31.
        //
        // This bump is not cosmetic. Engines 4.56 through 4.58 carry a Go
        // panic on discard, fixed in 4.59: a hand card arrived in the discard
        // pile before leaving the hand, so an on_discard trigger that discards
        // again indexed past the end. engine.go has no recover() and Kotlin
        // calls Mobile.run() unwrapped, so that panic aborts the process
        // instead of raising an exception. Players on 41 can crash.
        //
        // 43 on 2026-11-11, onto engine v4.60 (6c7a6c2): "except" restricted
        // energy (exclude_supertypes) and a new spend order -- narrowest
        // first, ephemeral before persistent, then gain order.
        //
        // 42 was built 11-06 with engine 4.59 and, as far as this repo can
        // tell, never uploaded: cardbattle-agent-1.31-42.aab still sits in
        // ~/Downloads. It is still treated as spent, per the rule above. Note
        // what happened to it, because it is the fourth instance of the same
        // thing: the league moved to v4.60 on 11-11 while that bundle sat
        // unuploaded, so uploading 42 now would ship an engine one version
        // behind the one scoring players. A build's shelf life here is about a
        // day; a bundle that waits five is not a bundle any more.
        //
        // No live card uses exclude_supertypes yet, so 4.60 changes no current
        // result by that route. The spend-order change does: 27 of 16,660
        // matches in the main repo's whole-catalogue sweep, 8 of them changing
        // the winner or how the match ends.
        //
        // 44 on 2026-11-11, onto engine v4.61 (05e7256): a supplement can be
        // paid with restricted energy, and supplement_reserve is ORDINARY
        // energy left. That bug was found from this side -- Plan.kt quoted the
        // old reserve formula, checking the quotation against the engine
        // turned up the fault, and the main session fixed it the same evening.
        //
        // 43 (engine 4.60) was built three hours earlier and is already stale;
        // like 42 it was never uploaded. Three bundles now sit in ~/Downloads
        // and only 1.33-44 is uploadable. The daily-shelf-life note above is
        // not pessimism.
        //
        // Check tools/check_engine_parity.sh immediately before uploading, not
        // when starting the build, because the answer changes daily.
        versionCode 44
        versionName "1.33"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Side-by-side test install: ./gradlew assembleRelease -PdevId
        //
        // A build signed with the UPLOAD key cannot replace one Play
        // installed, because Play re-signs with its own -- so verifying a
        // change on a real phone otherwise means uninstalling the player's
        // app. That takes their token with it, and since their handle is
        // already registered they cannot rejoin as themselves. A separate
        // applicationId installs beside it and touches nothing.
        manifestPlaceholders = [appLabel: "Cardbattle"]
        if (project.hasProperty('devId')) {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            // Renamed too, or the two sit side by side on the launcher under
            // the same name and the wrong one gets opened.
            manifestPlaceholders = [appLabel: "Cardbattle (dev)"]
        }

        // The engine AAR ships arm64 only. Adding more ABIs means rebuilding
        // it with more -target values in build_aar.sh; each one adds ~3.8MB of
        // libgojni.so to the APK.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
        }

        debug {
            // DEBUG BUILDS INSTALL AS .dev BY DEFAULT. Pass -PprodId to aim a
            // debug build at the production applicationId on purpose.
            //
            // Measured on Ryan's S22, 2026-11-11: the app installed there as
            // `online.autobattle.agent` -- the one holding his league account
            // -- is signed with the ANDROID DEBUG key (SHA-256 6757cd35,
            // CN=Android Debug), versionCode 40, installerPackageName=null.
            // It is a local sideload, not a Play install.
            //
            // That makes the collision real rather than theoretical. A debug
            // build carries the same signature, so `installDebug` without a
            // flag would replace that app -- and `connectedAndroidTest` runs
            // with uninstall_after_test: true, so it would then UNINSTALL it.
            // The league token goes with it and the handle cannot be
            // re-registered. One forgotten argument, account gone.
            //
            // So the safe id is the default and the dangerous one is opt-in.
            //
            // The suffix is ".debug", NOT ".dev", and the difference matters.
            // Three installs coexist on that phone and each has its own key:
            //
            //   online.autobattle.agent         debug key   Ryan's main agent
            //   online.autobattle.agent.dev     UPLOAD key  assembleRelease -PdevId
            //   online.autobattle.agent.debug   debug key   this, disposable
            //
            // Sending debug builds to .dev would put two different signatures
            // on one id, and whichever installed first would lock the other
            // out -- so the standing rule to keep .dev current with a RELEASE
            // build would start failing. -PdevId applies its own suffix in
            // defaultConfig, hence the second guard: both would give .dev.debug.
            if (!project.hasProperty('prodId') && !project.hasProperty('devId')) {
                applicationIdSuffix ".debug"
                versionNameSuffix "-debug"
                manifestPlaceholders = [appLabel: "Cardbattle (debug)"]
            }
        }
    }

    buildFeatures { compose true }
}

dependencies {
    implementation files('libs/engine.aar')

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
