apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing, mirroring autobattle-mobile. keystore.properties and the
// .jks itself stay OUT of git; the build falls back to unsigned when they are
// absent so a clean checkout still builds a debug APK.
//
// Deliberately reuses autobattle-mobile's keystore rather than minting a new
// one: under Play App Signing this is only the UPLOAD key (Google holds the
// real signing key), so it is one secret to protect instead of two, it is
// already backed up, and it has already been through Android developer
// verification once.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'online.autobattle.agent'
    compileSdk 36

    defaultConfig {
        applicationId "online.autobattle.agent"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The engine AAR ships arm64 only. Adding more ABIs means rebuilding
        // it with more -target values in build_aar.sh; each one adds ~3.8MB of
        // libgojni.so to the APK.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
        }
    }

    buildFeatures { compose true }
}

dependencies {
    implementation files('libs/engine.aar')

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
