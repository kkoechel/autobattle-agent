buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        // Matched to the existing autobattle-mobile app so both projects can
        // share a Gradle install and a CI image.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        // Required from Kotlin 2.0: the Compose compiler ships as its own
        // plugin rather than a kotlinCompilerExtensionVersion.
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}
